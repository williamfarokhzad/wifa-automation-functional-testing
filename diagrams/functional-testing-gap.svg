<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img"><title>A missing sample makes an otherwise similar trace inconclusive</title><rect width="1000" height="520" rx="24" fill="#f1f8f7"/><g font-family="DejaVu Sans, sans-serif"><text x="42" y="63" fill="#132e38" text-anchor="start" font-size="41" font-weight="700">A gap is not a zero</text><text x="43" y="109" fill="#385760" text-anchor="start" font-size="23">FT-01  |  compare two CSV traces on the same clock</text><text x="43" y="169" fill="#006d68" text-anchor="start" font-size="25" font-weight="700">Complete capture: PASS</text><path d="M170.0 209 L874.0 209" fill="none" stroke="#afc5c9" stroke-width="2"/><circle cx="170.0" cy="209" r="6" fill="#78949a"/><text x="170.0" y="248" fill="#385760" text-anchor="middle" font-size="18">+0</text><circle cx="258.0" cy="209" r="6" fill="#78949a"/><text x="258.0" y="248" fill="#385760" text-anchor="middle" font-size="18">+20</text><circle cx="346.0" cy="209" r="6" fill="#78949a"/><text x="346.0" y="248" fill="#385760" text-anchor="middle" font-size="18">+40</text><circle cx="434.0" cy="209" r="6" fill="#78949a"/><text x="434.0" y="248" fill="#385760" text-anchor="middle" font-size="18">+60</text><circle cx="522.0" cy="209" r="6" fill="#78949a"/><text x="522.0" y="248" fill="#385760" text-anchor="middle" font-size="18">+80</text><circle cx="610.0" cy="209" r="9" fill="#006d68"/><text x="610.0" y="248" fill="#385760" text-anchor="middle" font-size="18">+100</text><circle cx="698.0" cy="209" r="6" fill="#006d68"/><text x="698.0" y="248" fill="#385760" text-anchor="middle" font-size="18">+120</text><circle cx="786.0" cy="209" r="6" fill="#006d68"/><text x="786.0" y="248" fill="#385760" text-anchor="middle" font-size="18">+140</text><circle cx="874.0" cy="209" r="6" fill="#006d68"/><text x="874.0" y="248" fill="#385760" text-anchor="middle" font-size="18">+160</text><text x="43" y="315" fill="#985000" text-anchor="start" font-size="25" font-weight="700">Missing +80 ms: INCONCLUSIVE</text><path d="M170.0 355 L874.0 355" fill="none" stroke="#afc5c9" stroke-width="2"/><circle cx="170.0" cy="355" r="6" fill="#78949a"/><text x="170.0" y="394" fill="#385760" text-anchor="middle" font-size="18">+0</text><circle cx="258.0" cy="355" r="6" fill="#78949a"/><text x="258.0" y="394" fill="#385760" text-anchor="middle" font-size="18">+20</text><circle cx="346.0" cy="355" r="6" fill="#78949a"/><text x="346.0" y="394" fill="#385760" text-anchor="middle" font-size="18">+40</text><circle cx="434.0" cy="355" r="6" fill="#78949a"/><text x="434.0" y="394" fill="#385760" text-anchor="middle" font-size="18">+60</text><circle cx="522.0" cy="355" r="12" fill="#f1f8f7" stroke="#985000" stroke-width="4"/><text x="522.0" y="394" fill="#385760" text-anchor="middle" font-size="18">+80</text><circle cx="610.0" cy="355" r="9" fill="#006d68"/><text x="610.0" y="394" fill="#385760" text-anchor="middle" font-size="18">+100</text><circle cx="698.0" cy="355" r="6" fill="#006d68"/><text x="698.0" y="394" fill="#385760" text-anchor="middle" font-size="18">+120</text><circle cx="786.0" cy="355" r="6" fill="#006d68"/><text x="786.0" y="394" fill="#385760" text-anchor="middle" font-size="18">+140</text><circle cx="874.0" cy="355" r="6" fill="#006d68"/><text x="874.0" y="394" fill="#385760" text-anchor="middle" font-size="18">+160</text><text x="43" y="467" fill="#132e38" text-anchor="start" font-size="24">The first visible high is +100 ms in both traces.</text><text x="43" y="499" fill="#385760" text-anchor="start" font-size="22">A missing row breaks the required sampling grid.</text></g></svg>
