<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img"><title>First acknowledgement at the deadline versus one sample late</title><rect width="1000" height="520" rx="24" fill="#f1f8f7"/><g font-family="DejaVu Sans, sans-serif"><text x="42" y="63" fill="#132e38" text-anchor="start" font-size="41" font-weight="700">A 100 ms start response</text><text x="43" y="109" fill="#385760" text-anchor="start" font-size="23">FT-01  |  ready stays 1  |  one sample every 20 ms</text><path d="M665 145 L665 178" fill="none" stroke="#985000" stroke-width="3" stroke-dasharray="8 7"/><path d="M665 210 L665 284" fill="none" stroke="#985000" stroke-width="3" stroke-dasharray="8 7"/><path d="M665 320 L665 400" fill="none" stroke="#985000" stroke-width="3" stroke-dasharray="8 7"/><text x="665" y="139" fill="#985000" text-anchor="middle" font-size="22" font-weight="700">deadline</text><path d="M265 413 L905 413" fill="none" stroke="#385760" stroke-width="2"/><path d="M265 407 L265 419" fill="none" stroke="#385760" stroke-width="2"/><text x="265" y="451" fill="#385760" text-anchor="middle" font-size="19">+0</text><path d="M345 407 L345 419" fill="none" stroke="#385760" stroke-width="2"/><text x="345" y="451" fill="#385760" text-anchor="middle" font-size="19">+20</text><path d="M425 407 L425 419" fill="none" stroke="#385760" stroke-width="2"/><text x="425" y="451" fill="#385760" text-anchor="middle" font-size="19">+40</text><path d="M505 407 L505 419" fill="none" stroke="#385760" stroke-width="2"/><text x="505" y="451" fill="#385760" text-anchor="middle" font-size="19">+60</text><path d="M585 407 L585 419" fill="none" stroke="#385760" stroke-width="2"/><text x="585" y="451" fill="#385760" text-anchor="middle" font-size="19">+80</text><path d="M665 407 L665 419" fill="none" stroke="#385760" stroke-width="2"/><text x="665" y="451" fill="#385760" text-anchor="middle" font-size="19">+100</text><path d="M745 407 L745 419" fill="none" stroke="#385760" stroke-width="2"/><text x="745" y="451" fill="#385760" text-anchor="middle" font-size="19">+120</text><path d="M825 407 L825 419" fill="none" stroke="#385760" stroke-width="2"/><text x="825" y="451" fill="#385760" text-anchor="middle" font-size="19">+140</text><path d="M905 407 L905 419" fill="none" stroke="#385760" stroke-width="2"/><text x="905" y="451" fill="#385760" text-anchor="middle" font-size="19">+160</text><text x="44" y="232" fill="#006d68" text-anchor="start" font-size="29" font-weight="700">On time</text><path d="M265 225 L905 225" fill="none" stroke="#afc5c9" stroke-width="2"/><circle cx="265" cy="225" r="5" fill="#78949a"/><circle cx="345" cy="225" r="5" fill="#78949a"/><circle cx="425" cy="225" r="5" fill="#78949a"/><circle cx="505" cy="225" r="5" fill="#78949a"/><circle cx="585" cy="225" r="5" fill="#78949a"/><circle cx="665" cy="225" r="10" fill="#006d68"/><circle cx="745" cy="225" r="5" fill="#006d68"/><circle cx="825" cy="225" r="5" fill="#006d68"/><circle cx="905" cy="225" r="5" fill="#006d68"/><text x="665" y="203" fill="#006d68" text-anchor="middle" font-size="19" font-weight="700">first ACK +100</text><text x="44" y="340" fill="#9b293c" text-anchor="start" font-size="29" font-weight="700">Late</text><path d="M265 333 L905 333" fill="none" stroke="#afc5c9" stroke-width="2"/><circle cx="265" cy="333" r="5" fill="#78949a"/><circle cx="345" cy="333" r="5" fill="#78949a"/><circle cx="425" cy="333" r="5" fill="#78949a"/><circle cx="505" cy="333" r="5" fill="#78949a"/><circle cx="585" cy="333" r="5" fill="#78949a"/><circle cx="665" cy="333" r="5" fill="#78949a"/><circle cx="745" cy="333" r="10" fill="#9b293c"/><circle cx="825" cy="333" r="5" fill="#9b293c"/><circle cx="905" cy="333" r="5" fill="#9b293c"/><text x="745" y="311" fill="#9b293c" text-anchor="middle" font-size="19" font-weight="700">first ACK +120</text><text x="43" y="490" fill="#385760" text-anchor="start" font-size="22">Time after recorded start (ms). A large dot marks the first sampled 